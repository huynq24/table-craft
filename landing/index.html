<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applied before first paint so switching themes never flashes the wrong colors.
      ;(function () {
        try {
          var stored = localStorage.getItem('tablecraft-landing-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TableCraft is a free desktop app for Windows to connect to, browse, edit, and query MySQL/MariaDB and PostgreSQL databases — no command line required."
    />
    <title>TableCraft — Database GUI client for Windows</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
